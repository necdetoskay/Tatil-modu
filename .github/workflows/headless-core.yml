name: Headless Core Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  h0:
    name: H0 Repository Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Verify package manager
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck, boundaries and tests
        run: pnpm test:h0
