name: Headless Core Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  h0:
    name: H0 Repository Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Verify package manager
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: H11 headless acceptance
        run: pnpm h11:acceptance

      - name: UI readiness review
        run: pnpm test:ui-readiness

      - name: Upload H11 validation record
        uses: actions/upload-artifact@v4
        with:
          name: h11-validation-record
          path: docs/26-headless-implementation/H11-validation-record.md
